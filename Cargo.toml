[package]
name = "zenforge"
version = "0.3.1"
edition = "2021"
description = "Source control for AI agents"
license = "MIT"

[[bin]]
name = "zenforge"
path = "src/main.rs"

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
clap = { version = "4.5", features = ["derive"] }
sha2 = "0.10"
hex = "0.4"
chrono = "0.4"
flate2 = "1.0"

[profile.release]
opt-level = 3
lto = true
strip = true
